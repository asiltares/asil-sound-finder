<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>asil-sound-finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <img class="logo" src="../icons/avatar.jpg" alt="" />
      <h1>asil-sound-finder</h1>
      <button id="historyBtn" class="btn-circle" data-i18n-aria="history" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></g></svg>
      </button>
      <button id="settingsBtn" class="btn-circle" data-i18n-aria="settings" aria-expanded="false" aria-controls="settingsRow">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.98l-.36-2.54A.5.5 0 0 0 14.13 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.17.57-1.68.98l-2.39-.96a.5.5 0 0 0-.6.22L2.84 8.52a.5.5 0 0 0 .12.64l2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.51.41 1.08.74 1.68.98l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.6-.24 1.17-.57 1.68-.98l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"/></svg>
      </button>
      <button id="closeBtn" class="btn-circle" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div id="settingsRow" class="field-group" hidden>
      <span class="section-label" data-i18n="backupLabel"></span>
      <div class="input-pill">
        <input id="token" type="password" data-i18n-placeholder="tokenPlaceholder" autocomplete="off" spellcheck="false" />
        <button id="saveToken" class="btn btn-accent" data-i18n="save"></button>
      </div>
      <p class="hint" data-i18n="backupHint"></p>
    </div>

    <section id="idle" class="view orb-view">
      <div class="orb-ring">
        <button id="orbBtn" class="orb" data-i18n-aria="listen">
          <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true"><g fill="currentColor"><rect x="4" y="18" width="5" height="12" rx="2.5"/><rect x="13" y="11" width="5" height="26" rx="2.5"/><rect x="21.5" y="5" width="5" height="38" rx="2.5"/><rect x="30" y="11" width="5" height="26" rx="2.5"/><rect x="39" y="18" width="5" height="12" rx="2.5"/></g></svg>
        </button>
      </div>
    </section>

    <section id="listening" class="view orb-view" hidden>
      <div class="orb-ring pulsing">
        <div class="orb orb-listening" role="status" data-i18n-aria="listening">
          <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
      <p class="orb-caption" data-i18n="listening"></p>
    </section>

    <section id="result" class="view" hidden>
      <div class="track">
        <div id="coverSlot"></div>
        <div class="row-text">
          <span id="title" class="track-title"></span>
          <span id="artist" class="row-label"></span>
          <span id="details" class="row-label details" hidden></span>
          <span id="caught" class="tag" hidden></span>
        </div>
      </div>
      <div id="links" class="links"></div>
    </section>

    <section id="history" class="view" hidden>
      <div class="history-head">
        <span class="section-label" data-i18n="history"></span>
        <button id="clearHistory" class="btn btn-glass btn-small" data-i18n="clear"></button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="lead" data-i18n="historyEmpty" hidden></p>
    </section>

    <section id="message" class="view" hidden>
      <div class="row message-row">
        <p id="messageText"></p>
      </div>
      <button id="switchTabBtn" class="btn btn-glass btn-block" data-i18n="switchTab" hidden></button>
    </section>

    <footer class="actions">
      <button id="listenBtn" class="btn btn-accent btn-block btn-big" data-i18n="listen"></button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
